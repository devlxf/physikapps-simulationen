<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/physikapps-simulationen/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Simulationen zur Physik fuer den Unterricht">
  <meta name="theme-color" content="#1976D2">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PhysikApps">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PhysikApps Simulationen</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Der Startschuss wird mit wechselnder Adresse geholt.
    //
    // Warum nicht schlicht `<script src="flutter_bootstrap.js" async>`? Weil
    // Chrome diese Datei dann aus seinem **eigenen** Zwischenspeicher
    // ausliefert (GitHub Pages schickt `max-age=600`), ohne den Service
    // Worker auch nur zu fragen – im Zeitmesser der Seite steht dann
    // `deliveryType: "cache"` statt `"cache-storage"`. Genau an dieser Datei
    // erkennt der Service Worker aber, ob eine neue Fassung veröffentlicht
    // wurde (siehe `sw.js`); bekommt er die Anfrage nicht zu sehen, bleibt
    // die App auf ihrem alten Stand stehen. Der wechselnde Anhang macht die
    // Adresse für jeden Zwischenspeicher neu, also auch für Proxys im
    // Schulnetz. Der Service Worker legt sie trotzdem unter ihrem schlichten
    // Namen ab (`ignoreSearch`), der Vorrat wächst dadurch nicht.
    var startschuss = document.createElement('script');
    startschuss.src = 'flutter_bootstrap.js?' + Date.now();
    startschuss.async = true;
    document.body.appendChild(startschuss);
  </script>
</body>
</html>
